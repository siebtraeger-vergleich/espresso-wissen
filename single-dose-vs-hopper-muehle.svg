<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Single Dose und Hopper</title>
  <desc id="desc">Links eine abgewogene Portion pro Mahlung, rechts Bohnen im Behälter. Single Dose bei zwei Sorten, Hopper bei einer Sorte mit weniger Handgriffen.</desc>
  <rect width="1200" height="630" fill="#FDF8F1"/>
  <g transform="translate(0 7.5) scale(1.25)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Single Dose und Hopper</text>

      <text x="250" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Single Dose</text>
      <rect x="150" y="120" width="120" height="18" rx="3" fill="#4A2C2A"/>
      <rect x="168" y="138" width="84" height="70" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <ellipse cx="210" cy="196" rx="18" ry="8" fill="#6B4034"/>
      <text x="250" y="236" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Waage</text>
      <rect x="190" y="250" width="120" height="90" rx="10" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2"/>
      <text x="250" y="302" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">Mühle</text>
      <text x="250" y="370" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">eine abgewogene Portion</text>
      <text x="250" y="394" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Besser bei zwei Bohnensorten</text>

      <text x="710" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Hopper</text>
      <path d="M650,118 H770 L790,200 H630 Z" fill="#E8D7C0" stroke="#4A2C2A" stroke-width="2.5"/>
      <g fill="#6B4034">
        <ellipse cx="690" cy="150" rx="10" ry="7"/>
        <ellipse cx="716" cy="142" rx="10" ry="7"/>
        <ellipse cx="742" cy="156" rx="10" ry="7"/>
        <ellipse cx="704" cy="172" rx="10" ry="7"/>
        <ellipse cx="730" cy="178" rx="10" ry="7"/>
      </g>
      <text x="710" y="230" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Bohnenbehälter</text>
      <rect x="650" y="250" width="120" height="90" rx="10" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2"/>
      <text x="710" y="302" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">Mühle</text>
      <text x="710" y="370" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Bohnen liegen bereit</text>
      <text x="710" y="394" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Besser bei einer Sorte am Tag</text>
  </g>
  <a href="https://siebtraeger-vergleich.de/wissen/single-dose-vs-hopper.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="600" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
  </a>
</svg>
