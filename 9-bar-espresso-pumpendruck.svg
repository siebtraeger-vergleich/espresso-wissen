<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Pumpenzahl und Druck am Puck</title>
  <desc id="desc">Links der maximal beworbene Pumpendruck auf dem Karton, rechts etwa 9 bar als verbreiteter Bezugswert am Kaffeepuck.</desc>
  <rect width="1200" height="630" fill="#FDF8F1"/>
  <g transform="translate(10 0) scale(1.229167)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Pumpenzahl und Druck am Puck</text>
      <defs>
        <marker id="ai" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A2C2A"/></marker>
      </defs>

      <rect x="70" y="110" width="300" height="280" rx="12" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <text x="220" y="156" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#6B5348">Auf dem Karton</text>
      <text x="220" y="230" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#4A2C2A">15 / 19 bar</text>
      <text x="220" y="276" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#333">maximal beworbener Pumpendruck</text>
      <text x="220" y="340" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#6B5348">kein Qualitätsurteil</text>

      <line x1="390" y1="250" x2="548" y2="250" stroke="#4A2C2A" stroke-width="2.5" marker-end="url(#ai)"/>
      <text x="470" y="232" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">am Sieb</text>

      <rect x="560" y="110" width="330" height="280" rx="12" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2"/>
      <text x="725" y="156" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#6B5348">Am Kaffeepuck</text>
      <text x="725" y="230" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#4A2C2A">etwa 9 bar</text>
      <text x="725" y="276" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" fill="#333">verbreiteter Bezugswert</text>
      <text x="725" y="340" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#6B5348">Mahlgrad und Dosis zählen mehr</text>
  </g>
  <a href="https://siebtraeger-vergleich.de/wissen/9-bar-espresso.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="600" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
  </a>
</svg>
