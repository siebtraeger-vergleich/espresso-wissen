<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Wärmetauscher: Brühwasser im Rohr durch den Dampfkessel</title>
  <desc id="desc">Schematischer Schnitt: Brühwasser läuft durch ein Rohr im Dampfkessel zur Brühgruppe, Dampf kommt aus demselben Kessel.</desc>
