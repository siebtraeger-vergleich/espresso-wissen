  <g transform="translate(55.714 0) scale(1.133929)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Wärmetauscher: ein Kessel, zwei Wege</text>
