<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">PID-Temperaturregelung</title>
  <desc id="desc">Regelkreis: Fühler misst die Kesseltemperatur, die Regelung steuert die Heizung in kleinen Schritten.</desc>
  <rect width="1200" height="630" fill="#FDF8F1"/>
  <g transform="translate(0 20) scale(1.25)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">PID: Fühler, Regelung, Heizung</text>
      <defs>
        <marker id="ai" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4A2C2A"/></marker>
      </defs>

      <rect x="90" y="150" width="180" height="140" rx="12" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2.5"/>
      <text x="180" y="216" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4A2C2A">Boiler</text>
      <text x="180" y="244" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">hält das Wasser heiß</text>

      <line x1="270" y1="190" x2="368" y2="130" stroke="#4A2C2A" stroke-width="2.5" marker-end="url(#ai)"/>
      <rect x="380" y="88" width="200" height="88" rx="10" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <text x="480" y="128" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Fühler</text>
      <text x="480" y="154" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">misst die Temperatur</text>

      <line x1="580" y1="132" x2="678" y2="190" stroke="#4A2C2A" stroke-width="2.5" marker-end="url(#ai)"/>
      <rect x="690" y="150" width="180" height="140" rx="12" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <text x="780" y="216" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4A2C2A">Regelung</text>
      <text x="780" y="244" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">vergleicht mit Sollwert</text>

      <line x1="780" y1="290" x2="780" y2="338" stroke="#4A2C2A" stroke-width="2.5"/>
      <line x1="780" y1="340" x2="180" y2="340" stroke="#4A2C2A" stroke-width="2.5"/>
      <rect x="380" y="300" width="200" height="80" rx="10" fill="#F3E2A8" stroke="#4A2C2A" stroke-width="2"/>
      <text x="480" y="336" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Heizung</text>
      <text x="480" y="362" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">kleine Korrekturen</text>
      <line x1="180" y1="340" x2="180" y2="292" stroke="#4A2C2A" stroke-width="2.5" marker-end="url(#ai)"/>
  </g>
  <a href="https://siebtraeger-vergleich.de/wissen/pid.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="600" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
  </a>
</svg>
