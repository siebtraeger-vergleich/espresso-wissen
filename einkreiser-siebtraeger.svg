<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Einkreiser: ein Boiler für Espresso und Dampf</title>
  <desc id="desc">Schematischer Ablauf mit einem Boiler: erst Espresso, dann Aufheizen für Dampf, danach Abkühlen vor dem nächsten Bezug.</desc>
  <rect width="1200" height="675" fill="#FDF8F1"/>
  <g transform="translate(13.846 0) scale(1.221154)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Einkreiser: ein Boiler nacheinander</text>
      <defs>
        <marker id="aw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3D6B7A"/></marker>
        <marker id="as" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B8952F"/></marker>
      </defs>

      <rect x="56" y="160" width="80" height="150" rx="8" fill="#E8F1F4" stroke="#4A2C2A" stroke-width="2"/>
      <rect x="64" y="214" width="64" height="88" rx="4" fill="#3D6B7A"/>
      <text x="96" y="332" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Wassertank</text>

      <line x1="136" y1="270" x2="188" y2="270" stroke="#3D6B7A" stroke-width="4" marker-end="url(#aw)"/>
      <circle cx="220" cy="270" r="24" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <text x="220" y="275" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#4A2C2A">Pumpe</text>
      <line x1="244" y1="270" x2="318" y2="270" stroke="#3D6B7A" stroke-width="4" marker-end="url(#aw)"/>

      <rect x="330" y="128" width="200" height="220" rx="16" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2.5"/>
      <text x="430" y="244" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Ein Boiler</text>
      <text x="430" y="268" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Brühen oder Dampf</text>

      <line x1="530" y1="190" x2="620" y2="150" stroke="#3D6B7A" stroke-width="4" marker-end="url(#aw)"/>
      <rect x="632" y="108" width="86" height="64" rx="8" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <path d="M650,172 L700,172 L692,214 L658,214 Z" fill="#4A2C2A"/>
      <text x="675" y="98" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Brühgruppe</text>

      <line x1="530" y1="286" x2="620" y2="326" stroke="#B8952F" stroke-width="4" marker-end="url(#as)"/>
      <line x1="632" y1="332" x2="720" y2="332" stroke="#B8952F" stroke-width="5" stroke-linecap="round"/>
      <text x="676" y="318" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">Dampflanze</text>

      <rect x="48" y="390" width="200" height="86" rx="8" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="1.5"/>
      <text x="148" y="426" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">1 Espresso</text>
      <text x="148" y="450" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#6B5348">Boiler auf Brühtemperatur</text>
      <rect x="268" y="390" width="200" height="86" rx="8" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="1.5"/>
      <text x="368" y="426" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">2 Aufheizen</text>
      <text x="368" y="450" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#6B5348">warten auf Dampf</text>
      <rect x="488" y="390" width="200" height="86" rx="8" fill="#F3E2A8" stroke="#4A2C2A" stroke-width="1.5"/>
      <text x="588" y="426" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">3 Dampf</text>
      <text x="588" y="450" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#6B5348">Milch schäumen</text>
      <rect x="708" y="390" width="200" height="86" rx="8" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="1.5"/>
      <text x="808" y="426" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4A2C2A">4 Abkühlen</text>
      <text x="808" y="450" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#6B5348">vor dem nächsten Espresso</text>
  </g>
  <a href="https://siebtraeger-vergleich.de/wissen/einkreiser.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="645" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
  </a>
</svg>
