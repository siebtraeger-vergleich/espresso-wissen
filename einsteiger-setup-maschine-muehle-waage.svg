<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Einsteiger-Setup: Mühle zuerst präzise einstellbar wählen</title>
  <desc id="desc">Drei Teile auf der Arbeitsplatte in Priorität: zuerst eine präzise einstellbare Mühle, dann Maschine, dann Waage.</desc>
  <rect width="1200" height="630" fill="#FDF8F1"/>
  <g transform="translate(0 20) scale(1.25)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Einsteiger-Setup: Mühle zuerst präzise einstellbar wählen</text>

      <rect x="48" y="360" width="864" height="24" fill="#C4B49A" stroke="#4A2C2A" stroke-width="2"/>

      <circle cx="185" cy="118" r="18" fill="#4A2C2A"/>
      <text x="185" y="124" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FDF8F1">1</text>
      <rect x="110" y="140" width="150" height="220" rx="10" fill="#E8D7C0" stroke="#4A2C2A" stroke-width="3"/>
      <path d="M135,112 H235 L260,140 H110 Z" fill="#D8C4A8" stroke="#4A2C2A" stroke-width="2"/>
      <circle cx="185" cy="230" r="28" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <text x="185" y="400" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4A2C2A">Mühle</text>

      <circle cx="480" cy="118" r="18" fill="#6B5348"/>
      <text x="480" y="124" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FDF8F1">2</text>
      <rect x="405" y="168" width="150" height="192" rx="10" fill="#F5E6D3" stroke="#4A2C2A" stroke-width="2.5"/>
      <rect x="443" y="196" width="74" height="56" rx="6" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="1.5"/>
      <path d="M455,280 L505,280 L495,318 L465,318 Z" fill="#4A2C2A"/>
      <text x="480" y="400" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4A2C2A">Maschine</text>

      <circle cx="770" cy="118" r="18" fill="#6B5348"/>
      <text x="770" y="124" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FDF8F1">3</text>
      <rect x="700" y="248" width="140" height="28" rx="4" fill="#4A2C2A"/>
      <rect x="724" y="276" width="92" height="84" fill="#FFFFFF" stroke="#4A2C2A" stroke-width="2"/>
      <ellipse cx="770" cy="348" rx="16" ry="7" fill="#6B4034"/>
      <text x="770" y="400" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4A2C2A">Waage</text>
  </g>
  <a href="https://siebtraeger-vergleich.de/siebtraeger-einsteiger-set.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="600" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
