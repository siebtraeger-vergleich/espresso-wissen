<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">54 mm und 58 mm: Nennmaß, Puckform und Zubehör</title>
  <desc id="desc">Schematischer Vergleich: bei gleicher Dosis wirkt der Puck im 54-mm-System höher und im 58-mm-System flacher. Siebkorb-Innendurchmesser und -tiefe können je nach Hersteller abweichen.</desc>
  <rect width="1200" height="675" fill="#FDF8F1"/>
  <g transform="translate(0 5) scale(1.25)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">54 mm und 58 mm: Nennmaß, Puckform und Zubehör</text>

      <text x="250" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4A2C2A">54 mm</text>
      <text x="710" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#4A2C2A">58 mm</text>

      <line x1="176" y1="128" x2="176" y2="360" stroke="#4A2C2A" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="324" y1="128" x2="324" y2="360" stroke="#4A2C2A" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M176,140 H324 L344,360 H156 Z" fill="#E8D7C0" stroke="#4A2C2A" stroke-width="2.5"/>
      <path d="M188,168 H312 L326,348 H174 Z" fill="#6B4034"/>
      <text x="250" y="268" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#FDF8F1">höher</text>
      <line x1="176" y1="372" x2="324" y2="372" stroke="#4A2C2A" stroke-width="2"/>
      <text x="250" y="396" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">54 mm Nennmaß (schematisch)</text>
      <text x="250" y="430" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Zubehör oft maschinenbezogen</text>

      <line x1="612" y1="128" x2="612" y2="360" stroke="#4A2C2A" stroke-width="1.5" stroke-dasharray="4 4"/>
      <line x1="808" y1="128" x2="808" y2="360" stroke="#4A2C2A" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M612,168 H808 L824,360 H596 Z" fill="#E8D7C0" stroke="#4A2C2A" stroke-width="2.5"/>
      <path d="M624,208 H796 L808,348 H612 Z" fill="#6B4034"/>
      <text x="710" y="286" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#FDF8F1">flacher</text>
      <line x1="612" y1="372" x2="808" y2="372" stroke="#4A2C2A" stroke-width="2"/>
      <text x="710" y="396" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">58 mm Nennmaß (schematisch)</text>
      <text x="710" y="430" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">größeres Tamper- und Siebangebot</text>

      <text x="480" y="468" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Siebkorb-Innendurchmesser und -tiefe können je nach Hersteller abweichen.</text>
  </g>
  <a href="https://siebtraeger-vergleich.de/wissen/54-vs-58-mm.html" aria-label="siebtraeger-vergleich.de">
    <text x="1170" y="645" text-anchor="end" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4A2C2A" fill-opacity="0.7">siebtraeger-vergleich.de</text>
  </a>
</svg>
