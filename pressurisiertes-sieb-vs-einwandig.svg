<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Pressurisiertes Sieb und einwandiges Sieb</title>
  <desc id="desc">Links zweiter Boden mit Drosselung schematisch, rechts offenes Lochbild ohne zweiten Boden.</desc>
  <rect width="1200" height="675" fill="#FDF8F1"/>
  <g transform="translate(0 5) scale(1.25)">
    <text x="40" y="46" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#4A2C2A">Pressurisiertes Sieb und einwandiges Sieb</text>

      <text x="250" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Pressurisiert</text>
      <text x="710" y="96" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4A2C2A">Einwandig</text>

      <path d="M190,120 H310 L330,320 H170 Z" fill="#D8C4A8" stroke="#4A2C2A" stroke-width="2.5"/>
      <path d="M206,136 H294 L308,292 H192 Z" fill="#6B4034"/>
      <rect x="168" y="318" width="164" height="18" fill="#C4B49A" stroke="#4A2C2A" stroke-width="2"/>
      <circle cx="250" cy="327" r="6" fill="#3D6B7A"/>
      <line x1="250" y1="333" x2="250" y2="372" stroke="#3D6B7A" stroke-width="4"/>
      <text x="250" y="400" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">zweiter Boden / Drosselung</text>
      <text x="250" y="422" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">(schematisch)</text>
      <text x="250" y="456" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Widerstand sitzt im Sieb</text>

      <path d="M650,120 H770 L790,320 H630 Z" fill="#D8C4A8" stroke="#4A2C2A" stroke-width="2.5"/>
      <path d="M666,136 H754 L768,300 H652 Z" fill="#6B4034"/>
      <g fill="#3D6B7A">
        <circle cx="680" cy="312" r="3.5"/>
        <circle cx="698" cy="312" r="3.5"/>
        <circle cx="716" cy="312" r="3.5"/>
        <circle cx="734" cy="312" r="3.5"/>
        <circle cx="689" cy="326" r="3.5"/>
        <circle cx="707" cy="326" r="3.5"/>
        <circle cx="725" cy="326" r="3.5"/>
      </g>
      <line x1="698" y1="330" x2="690" y2="372" stroke="#3D6B7A" stroke-width="2"/>
      <line x1="716" y1="330" x2="716" y2="372" stroke="#3D6B7A" stroke-width="2"/>
      <line x1="734" y1="330" x2="742" y2="372" stroke="#3D6B7A" stroke-width="2"/>
      <text x="710" y="400" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">offenes Lochbild</text>
      <text x="710" y="422" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#333">kein zweiter Boden</text>
      <text x="710" y="456" text-anchor="middle" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#6B5348">Widerstand sitzt im Puck</text>
  </g>
